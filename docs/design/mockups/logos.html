<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<title>Логотип: варианты</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&display=swap" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "Onest", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  .board { width: 1720px; height: 860px; background: #eef2ef; padding: 56px; display: flex; flex-direction: column; gap: 36px; }
  h1 { font-size: 30px; font-weight: 750; letter-spacing: -.02em; color: #18211c; }
  h1 + p { font-size: 16px; color: #55615a; margin-top: 8px; }
  .grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 20px; flex: 1; align-items: start; }
  .card { background: #fff; border-radius: 24px; padding: 28px 24px; display: flex; flex-direction: column; gap: 22px; }
  .icon { display: flex; justify-content: center; padding: 8px 0 4px; }
  .icon svg { width: 168px; height: 168px; filter: drop-shadow(0 14px 26px rgb(20 80 50 / .18)); }
  .word { display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-radius: 16px; background: #f4f6f5; }
  .word svg { width: 40px; height: 40px; flex: none; }
  .word b { font-size: 18px; font-weight: 750; color: #18211c; line-height: 1.1; }
  .word small { display: block; font-size: 12px; font-weight: 500; color: #647069; }
  .word.dark { background: #141916; }
  .word.dark b { color: #eef3f0; }
  .word.dark small { color: #9aa8a0; }
  h2 { font-size: 20px; font-weight: 750; color: #18211c; }
  .card p { font-size: 15px; line-height: 1.5; color: #4f5b54; }
  .small { display: flex; gap: 14px; align-items: end; }
  .small svg { border-radius: 22%; }
  .small span { font-size: 12px; color: #7a857f; }
</style>
</head>
<body>
<div class="board">
  <div><h1>Логотип: 5 направлений</h1><p>Все знаки свои: без круга с галочкой, фирменного градиента и шрифта Сбера. Зелёный оставлен как «банковский» цвет, его можно сменить.</p></div>
  <div class="grid" id="grid"></div>
</div>
<script>
const G = `<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3FD46A"/><stop offset=".55" stop-color="#14A048"/><stop offset="1" stop-color="#0B7A5C"/></linearGradient></defs>`;
const tile = (inner, bg = "url(#g)") => `<svg viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">${G}<rect width="1024" height="1024" rx="228" fill="${bg}"/>${inner}</svg>`;

const L = [
  { name: "A. Модули", idea: "Текущий знак: экран собирается из виджетов, плюс означает «добавь свой». Понятно, что это конструктор.",
    svg: tile(`<rect x="232" y="232" width="252" height="252" rx="72" fill="#fff"/><rect x="540" y="232" width="252" height="252" rx="72" fill="#fff" opacity=".9"/><rect x="232" y="540" width="252" height="252" rx="72" fill="#fff" opacity=".9"/><rect x="558" y="558" width="216" height="216" rx="58" fill="none" stroke="#fff" stroke-width="36"/><path d="M666 616V716M616 666H716" stroke="#fff" stroke-width="40" stroke-linecap="round"/><circle cx="358" cy="358" r="58" fill="#14A048"/>`) },
  { name: "B. Крупнее", idea: "Три буквы «А» растут слева направо: главная идея продукта, текст и кнопки можно сделать крупнее.",
    svg: tile(`<g fill="#fff" font-family="Onest" font-weight="800"><text x="200" y="700" font-size="220" opacity=".7">А</text><text x="380" y="720" font-size="320" opacity=".85">А</text><text x="590" y="760" font-size="440">А</text></g><rect x="200" y="790" width="624" height="26" rx="13" fill="#fff" opacity=".5"/>`) },
  { name: "C. Под себя", idea: "Ползунок настройки: пользователь сам выбирает, как ему удобно. Простой знак, хорошо читается в маленьком размере.",
    svg: tile(`<rect x="212" y="300" width="600" height="64" rx="32" fill="#fff" opacity=".45"/><rect x="212" y="300" width="390" height="64" rx="32" fill="#fff"/><circle cx="602" cy="332" r="92" fill="#fff"/><circle cx="602" cy="332" r="46" fill="#14A048"/><rect x="212" y="640" width="600" height="64" rx="32" fill="#fff" opacity=".45"/><rect x="212" y="640" width="210" height="64" rx="32" fill="#fff"/><circle cx="422" cy="672" r="92" fill="#fff"/><circle cx="422" cy="672" r="46" fill="#14A048"/>`) },
  { name: "D. Монограмма К", idea: "Буква «К» из скруглённых блоков, как из виджетов. Работает как короткий знак рядом с названием.",
    svg: tile(`<rect x="268" y="232" width="150" height="560" rx="75" fill="#fff"/><rect x="452" y="232" width="150" height="372" rx="75" fill="#fff" transform="rotate(42 527 418)"/><rect x="470" y="440" width="150" height="372" rx="75" fill="#fff" transform="rotate(-40 545 626)"/>`) },
  { name: "E. Свой экран", idea: "Телефон, в котором один виджет выделен: «мой экран, мои правила». Нейтрально и спокойно, без банковских клише.",
    svg: tile(`<rect x="312" y="176" width="400" height="672" rx="96" fill="none" stroke="#fff" stroke-width="44"/><rect x="380" y="270" width="264" height="168" rx="40" fill="#fff"/><rect x="380" y="474" width="120" height="120" rx="34" fill="#fff" opacity=".6"/><rect x="524" y="474" width="120" height="120" rx="34" fill="#fff" opacity=".6"/><rect x="452" y="730" width="120" height="30" rx="15" fill="#fff"/>`) },
];
document.getElementById("grid").innerHTML = L.map(l => `<div class="card">
  <div class="icon">${l.svg}</div>
  <h2>${l.name}</h2><p>${l.idea}</p>
  <div class="word">${l.svg}<b>Конструктор<small>доступных интерфейсов</small></b></div>
  <div class="word dark">${l.svg}<b>Конструктор<small>доступных интерфейсов</small></b></div>
  <div class="small">${l.svg.replace("<svg ", '<svg width="58" height="58" ')}${l.svg.replace("<svg ", '<svg width="36" height="36" ')}${l.svg.replace("<svg ", '<svg width="20" height="20" ')}<span>иконка 58 / 36 / 20</span></div>
</div>`).join("");
</script>
</body>
</html>
